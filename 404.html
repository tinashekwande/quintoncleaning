<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Quinton Chinoz Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FAFAFA;
      color: #2C2C2C;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .error-container {
      max-width: 520px;
      width: 100%;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-code {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(6rem, 20vw, 9.5rem);
      font-weight: 700;
      line-height: 0.95;
      color: #C0392B;
      margin-bottom: 1rem;
      user-select: none;
      letter-spacing: -0.02em;
    }

    .error-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 600;
      color: #2C2C2C;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .error-message {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      color: #555555;
      line-height: 1.6;
      margin-bottom: 2.25rem;
      max-width: 400px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #C0392B;
      color: #FFFFFF;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.875rem 2.25rem;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(192, 57, 43, 0.25);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .home-btn:hover {
      background-color: #a93226;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(192, 57, 43, 0.35);
    }

    .home-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(192, 57, 43, 0.25);
    }

    .home-btn:focus-visible {
      outline: 2px solid #C0392B;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="error-container" style="max-width: 520px; width: 100%; padding: 2.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <div class="error-code" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(6rem, 20vw, 9.5rem); font-weight: 700; line-height: 0.95; color: #C0392B; margin-bottom: 1rem;">404</div>
    <h1 class="error-title" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 600; color: #2C2C2C; line-height: 1.2; margin-bottom: 1rem;">Page Not Found</h1>
    <p class="error-message" style="font-family: 'Montserrat', sans-serif; font-size: clamp(0.95rem, 2.5vw, 1.05rem); color: #555555; line-height: 1.6; margin-bottom: 2.25rem; max-width: 400px;">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-btn" style="display: inline-flex; align-items: center; justify-content: center; background-color: #C0392B; color: #FFFFFF; text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 600; padding: 0.875rem 2.25rem; border-radius: 6px;">Back to Home</a>
  </main>
</body>
</html>
